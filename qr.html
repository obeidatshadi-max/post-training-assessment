<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code — Post-Training Feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F7F7FB;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      letter-spacing: -0.01em;
    }
    .card {
      background: #fff;
      border: 1px solid #E7E5F2;
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(23,18,63,0.04), 0 16px 32px -8px rgba(79,70,229,0.16);
      padding: 40px 48px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    h1 { font-size: 1.2rem; font-weight: 700; color: #191733; margin-bottom: 4px; letter-spacing: -0.02em; }
    p  { color: #64748B; font-size: 0.875rem; margin-bottom: 28px; }
    #qrcode { display: inline-block; margin-bottom: 24px; padding: 12px; background: #F7F7FB; border-radius: 14px; }
    #qrcode img { border-radius: 8px; display: block; }
    .url {
      font-size: 0.8rem;
      color: #4F46E5;
      word-break: break-all;
      margin-bottom: 28px;
    }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    button {
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, #4F46E5 0%, #4338CA 100%); color: #fff; box-shadow: 0 6px 16px -4px rgba(79,70,229,0.45); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -4px rgba(79,70,229,0.5); }
    .btn-outline { background: #fff; color: #4F46E5; border: 1.5px solid #4F46E5; }
    .btn-outline:hover { background: #EEF2FF; }

    @media print {
      body { background: #fff; }
      .btns { display: none; }
      .card { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Post-Training Feedback</h1>
    <p>Scan to start the assessment on your phone</p>
    <div id="qrcode"></div>
    <div class="url">https://post-training-assessment.netlify.app</div>
    <div class="btns">
      <button class="btn-primary" onclick="downloadQR()">⬇ Download PNG</button>
      <button class="btn-outline" onclick="window.print()">🖨 Print</button>
    </div>
  </div>

  <script>
    const QR_API = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data=' +
                   encodeURIComponent('https://post-training-assessment.netlify.app');

    // Display QR image
    const img = document.createElement('img');
    img.src = QR_API;
    img.width = 260;
    img.alt = 'QR Code';
    document.getElementById('qrcode').appendChild(img);

    async function downloadQR() {
      try {
        const res = await fetch(QR_API);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'post-training-feedback-qr.png';
        a.click();
        URL.revokeObjectURL(url);
      } catch(e) {
        // Fallback: open image in new tab → right-click → save
        window.open(QR_API, '_blank');
      }
    }
  </script>
</body>
</html>
